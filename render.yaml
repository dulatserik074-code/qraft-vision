services:
  - type: web
    name: qraft-vision
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PUBLIC_APP_URL
        value: https://qraft-vision.onrender.com
